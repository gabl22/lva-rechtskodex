name: Build Legal Code

on:
  workflow_dispatch:
  schedule:
    - cron: '43 */3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run build
        env:
          HACKMD_API_KEY: ${{ secrets.HACKMD_API_KEY }}
          HACKMD_NOTE_ID: ${{ secrets.HACKMD_NOTE_ID }}
        run: npm run build

      - name: Check for changes
        id: diff
        run: |
          git add docs/index.html docs/styles.css docs/search.js
          if git diff --quiet --cached docs/index.html docs/styles.css docs/search.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update legal code"
          git push

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes."
