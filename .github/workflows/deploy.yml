name: Build Legal Code

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build HTML
        env:
          HACKMD_API_KEY: ${{ secrets.HACKMD_API_KEY }}
          HACKMD_NOTE_ID: ${{ secrets.HACKMD_NOTE_ID }}
        run: npm run build

      - name: Commit only if files changed
        run: |
          if git diff --quiet -- dist/index.html dist/styles.css; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist/index.html dist/styles.css
          git commit -m "Update"
          git push